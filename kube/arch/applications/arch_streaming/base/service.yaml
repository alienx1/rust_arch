apiVersion: v1
kind: Service
metadata:
  name: arch-streaming
  namespace: arch
  labels:
    app.kubernetes.io/name: arch-streaming
    app.kubernetes.io/component: streaming
    app.kubernetes.io/part-of: arch
    app.kubernetes.io/managed-by: kustomize
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: arch-streaming
  ports:
    - name: kafka-internal
      port: 9092
      targetPort: 9092
    - name: kafka-external
      port: 19092
      targetPort: 19092
      nodePort: 30092
    - name: admin
      port: 9644
      targetPort: 9644
      nodePort: 30644
    - name: schema-reg
      port: 8081
      targetPort: 8081
    - name: proxy
      port: 8082
      targetPort: 8082
---
# DNS alias service for redpanda
apiVersion: v1
kind: Service
metadata:
  name: redpanda
  namespace: arch
  labels:
    app.kubernetes.io/name: arch-streaming
    app.kubernetes.io/component: streaming
    app.kubernetes.io/part-of: arch
    app.kubernetes.io/managed-by: kustomize
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: arch-streaming
  ports:
    - name: kafka
      port: 9092
      targetPort: 9092
    - name: admin
      port: 9644
      targetPort: 9644
    - name: schema-reg
      port: 8081
      targetPort: 8081
    - name: proxy
      port: 8082
      targetPort: 8082
---
apiVersion: v1
kind: Service
metadata:
  name: arch-streaming-console
  namespace: arch
  labels:
    app.kubernetes.io/name: arch-streaming-console
    app.kubernetes.io/component: streaming-ui
    app.kubernetes.io/part-of: arch
    app.kubernetes.io/managed-by: kustomize
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: arch-streaming-console
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      nodePort: 30080
---
# DNS alias service for redpanda-console
apiVersion: v1
kind: Service
metadata:
  name: redpanda-console
  namespace: arch
  labels:
    app.kubernetes.io/name: arch-streaming-console
    app.kubernetes.io/component: streaming-ui
    app.kubernetes.io/part-of: arch
    app.kubernetes.io/managed-by: kustomize
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: arch-streaming-console
  ports:
    - name: http
      port: 8080
      targetPort: 8080
