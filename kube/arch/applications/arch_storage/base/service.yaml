apiVersion: v1
kind: Service
metadata:
  name: arch-storage
  namespace: arch
  labels:
    app.kubernetes.io/name: arch-storage
    app.kubernetes.io/component: storage
    app.kubernetes.io/part-of: arch
    app.kubernetes.io/managed-by: kustomize
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: arch-storage
  ports:
    - name: s3
      port: 3900
      targetPort: 3900
      nodePort: 30900
    - name: rpc
      port: 3902
      targetPort: 3902
    - name: admin
      port: 3903
      targetPort: 3903
      nodePort: 30903
---
# DNS alias service for garage
apiVersion: v1
kind: Service
metadata:
  name: garage
  namespace: arch
  labels:
    app.kubernetes.io/name: arch-storage
    app.kubernetes.io/component: storage
    app.kubernetes.io/part-of: arch
    app.kubernetes.io/managed-by: kustomize
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: arch-storage
  ports:
    - name: s3
      port: 3900
      targetPort: 3900
    - name: rpc
      port: 3902
      targetPort: 3902
    - name: admin
      port: 3903
      targetPort: 3903
