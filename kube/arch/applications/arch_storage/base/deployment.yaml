apiVersion: apps/v1
kind: Deployment
metadata:
  name: arch-storage
  namespace: arch
  labels:
    app.kubernetes.io/name: arch-storage
    app.kubernetes.io/instance: local
    app.kubernetes.io/component: storage
    app.kubernetes.io/part-of: arch
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  strategy:
    type: Recreate   # RWO volume: the old pod must release it first
  selector:
    matchLabels:
      app.kubernetes.io/name: arch-storage
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arch-storage
        app.kubernetes.io/instance: local
        app.kubernetes.io/component: storage
        app.kubernetes.io/part-of: arch
        app.kubernetes.io/managed-by: kustomize
    spec:
      containers:
        - name: garage
          image: dxflrs/garage:v1.1.0
          imagePullPolicy: IfNotPresent
          command:
            - /garage
            - -c
            - /etc/garage.toml
            - server
          ports:
            - containerPort: 3900
              name: s3
            - containerPort: 3902
              name: rpc
            - containerPort: 3903
              name: admin
          volumeMounts:
            - name: config
              mountPath: /etc/garage.toml
              subPath: garage.toml
            - name: data
              mountPath: /var/lib/garage
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 1000m
              memory: 512Mi
        # The garage image has no shell: layout, key and bucket are set through the admin API from a
        # sidecar. It re-runs on every pod start (it is idempotent) and then idles.
        - name: bootstrap
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "/bootstrap/garage-bootstrap.sh"]
          volumeMounts:
            - name: bootstrap
              mountPath: /bootstrap
          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: bootstrap
          configMap:
            name: arch-storage-config
            items:
              - key: garage-bootstrap.sh
                path: garage-bootstrap.sh
        - name: config
          configMap:
            name: arch-storage-config
        - name: data
          persistentVolumeClaim:
            claimName: arch-storage-data
---
# Survives pod recreation (local-path provisioner), like the Postgres data volume.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: arch-storage-data
  namespace: arch
  labels:
    app.kubernetes.io/name: arch-storage-data
    app.kubernetes.io/component: storage
    app.kubernetes.io/part-of: arch
    app.kubernetes.io/managed-by: kustomize
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
