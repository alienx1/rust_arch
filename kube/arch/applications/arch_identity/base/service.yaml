apiVersion: v1
kind: Service
metadata:
  name: arch-identity
  namespace: arch
  labels:
    app.kubernetes.io/name: arch-identity
    app.kubernetes.io/component: identity
    app.kubernetes.io/part-of: arch
    app.kubernetes.io/managed-by: kustomize
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: arch-identity
  ports:
    - name: public
      port: 4433
      targetPort: 4433
      nodePort: 30433
    - name: admin
      port: 4434
      targetPort: 4434
      nodePort: 30434
---
# DNS alias service for kratos
apiVersion: v1
kind: Service
metadata:
  name: kratos
  namespace: arch
  labels:
    app.kubernetes.io/name: arch-identity
    app.kubernetes.io/component: identity
    app.kubernetes.io/part-of: arch
    app.kubernetes.io/managed-by: kustomize
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: arch-identity
  ports:
    - name: public
      port: 4433
      targetPort: 4433
    - name: admin
      port: 4434
      targetPort: 4434
