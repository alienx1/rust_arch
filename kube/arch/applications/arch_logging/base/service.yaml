apiVersion: v1
kind: Service
metadata:
  name: arch-logging
  namespace: arch
  labels:
    app.kubernetes.io/name: arch-logging
    app.kubernetes.io/component: logging
    app.kubernetes.io/part-of: arch
    app.kubernetes.io/managed-by: kustomize
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: arch-logging
  ports:
    - name: rest
      port: 7280
      targetPort: 7280
      nodePort: 30280
    - name: grpc-otlp
      port: 7281
      targetPort: 7281
      nodePort: 30281
---
# DNS alias service for quickwit
apiVersion: v1
kind: Service
metadata:
  name: quickwit
  namespace: arch
  labels:
    app.kubernetes.io/name: arch-logging
    app.kubernetes.io/component: logging
    app.kubernetes.io/part-of: arch
    app.kubernetes.io/managed-by: kustomize
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: arch-logging
  ports:
    - name: rest
      port: 7280
      targetPort: 7280
    - name: grpc-otlp
      port: 7281
      targetPort: 7281
