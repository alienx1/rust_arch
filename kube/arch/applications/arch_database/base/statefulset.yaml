apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: arch-database
  namespace: arch
  labels:
    app.kubernetes.io/name: arch-database
    app.kubernetes.io/instance: local
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: arch
    app.kubernetes.io/managed-by: kustomize
spec:
  serviceName: arch-database
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: arch-database
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arch-database
        app.kubernetes.io/instance: local
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: arch
        app.kubernetes.io/managed-by: kustomize
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: postgres:17-bookworm
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: arch-common-config
            - configMapRef:
                name: arch-database-config
          env:
            - name: POSTGRES_DB
              value: "arch"
            - name: POSTGRES_USER
              value: "postgres"
            # Subdirectory so the volume root's lost+found never blocks initdb.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: POSTGRES_INITDB_ARGS
              value: "--locale-provider=icu --icu-locale=th-TH"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: arch-database-init-secret
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
              name: postgres
          volumeMounts:
            - name: init-config
              mountPath: /docker-entrypoint-initdb.d/000-bootstrap.sql
              subPath: 000-bootstrap.sql
            - name: sql-seeds
              mountPath: /docker-entrypoint-initdb.d/sql
            - name: data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: 2000m
              memory: 2Gi
      volumes:
        - name: init-config
          configMap:
            name: arch-database-initdb
        - name: sql-seeds
          hostPath:
            path: /mnt/sql
            type: Directory
  # Persistent data survives pod/cluster restarts (local-path provisioner).
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: local-path
        resources:
          requests:
            storage: 10Gi
