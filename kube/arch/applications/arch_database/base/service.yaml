apiVersion: v1
kind: Service
metadata:
  name: arch-database
  namespace: arch
  labels:
    app.kubernetes.io/name: arch-database
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: arch
    app.kubernetes.io/managed-by: kustomize
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: arch-database
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
      nodePort: 30432
---
# DNS alias service for pgedge
apiVersion: v1
kind: Service
metadata:
  name: pgedge
  namespace: arch
  labels:
    app.kubernetes.io/name: arch-database
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: arch
    app.kubernetes.io/managed-by: kustomize
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: arch-database
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
