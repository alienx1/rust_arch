apiVersion: v1
kind: Service
metadata:
  name: arch-cache
  namespace: arch
  labels:
    app.kubernetes.io/name: arch-cache
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: arch
    app.kubernetes.io/managed-by: kustomize
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: arch-cache
  ports:
    - name: valkey
      port: 6379
      targetPort: 6379
      nodePort: 30379
---
# DNS alias service for valkey
apiVersion: v1
kind: Service
metadata:
  name: valkey
  namespace: arch
  labels:
    app.kubernetes.io/name: arch-cache
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: arch
    app.kubernetes.io/managed-by: kustomize
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: arch-cache
  ports:
    - name: valkey
      port: 6379
      targetPort: 6379
