apiVersion: apps/v1
kind: Deployment
metadata:
  name: arch-cache
  namespace: arch
  labels:
    app.kubernetes.io/name: arch-cache
    app.kubernetes.io/instance: local
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: arch
    app.kubernetes.io/managed-by: kustomize
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: arch-cache
  template:
    metadata:
      labels:
        app.kubernetes.io/name: arch-cache
        app.kubernetes.io/instance: local
        app.kubernetes.io/component: cache
        app.kubernetes.io/part-of: arch
        app.kubernetes.io/managed-by: kustomize
    spec:
      containers:
        - name: valkey
          image: valkey/valkey:8.0-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 6379
              name: valkey
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 500m
              memory: 512Mi
