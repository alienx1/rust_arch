[workspace]
resolver = "2"
members = [
    "domain",
    "infrastructure",
    "application/core",
    "application/report",
    "application/notification",
    "application/master",
    "handler/web/package",
    "handler/api/report",
    "handler/api/notification",
    "handler/api/master",
    "handler/web/application/master",
]

[workspace.package]
version = "0.1.0"
authors = ["attaporn_j <alienx1step@gmail.com>"]
edition = "2024"
rust-version = "1.98.0"
license = "MIT"

[workspace.dependencies]
domain = { path = "domain" }
infrastructure = { path = "infrastructure" }
application-core = { path = "application/core" }
application-master = { path = "application/master" }
application-report = { path = "application/report" }
application-notification = { path = "application/notification" }
web-package = { path = "handler/web/package" }

# --- Async Runtime & HTTP Server -------------------------------------------
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "signal"] }
axum = "0.8"
futures-util = "0.3"
axum-extra = { version = "0.12", features = ["cookie", "typed-header"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "trace", "fs"] }

# --- Serialization & Binary Wire Format (CBOR) -----------------------------
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
ciborium = "0.2"
thiserror = "2.0"

# --- Database & ORM (PostgreSQL Wire Protocol / pgEdge) --------------------
sea-orm = { version = "2.0.4", features = ["sqlx-postgres", "runtime-tokio-rustls", "macros"] }

# --- Cache, Storage & Event Streaming (Redpanda / Garage) ------------------
redis = { version = "1.7", features = ["tokio-comp"] }
rdkafka = { version = "0.39.0", features = ["tokio", "zstd"] }
aws-sdk-s3 = { version = "1.152.0", default-features = false, features = ["default-https-client", "http-1x", "rt-tokio", "sigv4a"] }
aws-config = "1.12"

# --- Security, Identity & Cryptography (Ory Kratos / Tokens) ---------------
ory-kratos-client = "26.2.0"
argon2 = { version = "0.6", features = ["std"] }
jsonwebtoken = { version = "11.1.0", features = ["rust_crypto"] }
subtle = "2.6.1"
uuid = { version = "1.28.0", features = ["v7", "serde"] }
chrono = { version = "0.4.45", features = ["serde"] }

# --- Outbound HTTP & Reporting --------------------------------------------
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "cookies"] }
typst = "0.15"
typst-pdf = "0.15"
rust_xlsxwriter = { version = "0.99.1", features = ["chrono", "constant_memory", "zlib"] }
csv = "1.4"
async-trait = "0.1"
dotenvy = "0.15.7"

# --- Observability (Tracing & Quickwit / OTLP) ------------------------------
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-opentelemetry = "0.34.0"
opentelemetry = "0.33.1"
opentelemetry_sdk = "0.33.1"
opentelemetry-otlp = { version = "0.33.1", features = ["grpc-tonic"] }

# --- Frontend (Leptos WebAssembly + shadcn/ui) -----------------------------
leptos = { version = "0.8.20", features = ["csr"] }
leptos_router = { version = "0.8.15" }
tailwind_fuse = "0.3.2"
lucide-leptos = "3.56.0"
gloo-net = "0.7.0"
web-sys = { version = "0.3.77" }
js-sys = "0.3.77"
wasm-bindgen = "0.2.100"
wasm-bindgen-futures = "0.4.50"
console_error_panic_hook = "0.1.7"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
